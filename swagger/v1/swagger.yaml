---
openapi: 3.0.1
info:
  title: Weather Forecast API
  version: v1
  description: API for retrieving current weather and 5-day forecast by US zip code.
    Uses Open-Meteo as the weather data provider.
paths:
  "/api/v1/forecast":
    get:
      summary: Retrieve weather forecast for a given zip code
      tags:
      - Forecasts
      description: |
        Returns the current weather conditions and a 5-day extended forecast for the given US zip code.

        - Results are **cached for 30 minutes** per zip code.
        - The `cached` field in the response indicates whether the data came from the cache.
        - Temperatures are returned in **Fahrenheit**.
      parameters:
      - name: zip_code
        in: query
        required: true
        description: 5-digit US zip code
        example: '10001'
        schema:
          type: string
      - name: country_code
        in: query
        required: false
        description: ISO 3166-1 alpha-2 country code (defaults to 'us')
        example: us
        schema:
          type: string
      responses:
        '200':
          description: Forecast retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  zip_code:
                    type: string
                    example: '10001'
                    description: The zip code used for the lookup
                  location:
                    type: string
                    example: New York
                    description: Resolved location name
                  current_temperature:
                    type: number
                    example: 72.5
                    description: Current temperature in Fahrenheit
                  feels_like:
                    type: number
                    example: 70.1
                    description: Perceived temperature in Fahrenheit
                  temp_min:
                    type: number
                    example: 68.0
                    description: Today's minimum temperature in Fahrenheit
                  temp_max:
                    type: number
                    example: 76.0
                    description: Today's maximum temperature in Fahrenheit
                  humidity:
                    type: integer
                    example: 55
                    description: Relative humidity percentage
                  description:
                    type: string
                    example: clear sky
                    description: Human-readable weather description
                  cached:
                    type: boolean
                    example: false
                    description: Whether the result was served from cache
                  extended_forecast:
                    type: array
                    description: 5-day forecast starting from today
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          example: '2025-06-10'
                          description: Date in YYYY-MM-DD format
                        temp_min:
                          type: number
                          example: 65.0
                          description: Minimum temperature in Fahrenheit
                        temp_max:
                          type: number
                          example: 76.0
                          description: Maximum temperature in Fahrenheit
                        description:
                          type: string
                          example: partly cloudy
                          description: Weather description for the day
                      required:
                      - date
                      - temp_min
                      - temp_max
                      - description
                required:
                - zip_code
                - location
                - current_temperature
                - cached
        '400':
          description: Missing or invalid zip code
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Zip code is required
                required:
                - error
        '422':
          description: Location not found for the given zip code
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Could not find location for zip code 00000
                required:
                - error
servers:
- url: http://localhost:3000
  description: Local development
